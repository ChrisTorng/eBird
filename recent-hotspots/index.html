<head>
<meta charset="utf-8">

<title>eBird 最近熱門地點已搬遷</title>

<body>
<h1>eBird 最近熱門地點已搬遷</h1>
<p><a id="destination" href="https://christorng.idv.tw/eBirdRecentHotspot/">前往新網站</a></p>
<p><a href="https://github.com/ChrisTorng/eBirdRecentHotspot">新專案原始碼</a></p>
<script>
const destination = new URL('https://christorng.idv.tw/eBirdRecentHotspot/');
const params = new URLSearchParams(window.location.search);
for (const name of ['date', 'location']) {
  if (params.has(name)) destination.searchParams.set(name, params.get(name));
}
document.getElementById('destination').href = destination.href;
window.location.replace(destination.href);
</script>
</body>
